name: Windows CI
on:
  push:
    branches: ['**', '!dependabot/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Select commit packaging or tag release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve trusted build mode and numeric version
        id: mode
        env:
          DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B .github/scripts/build_mode.py
  checks:
    name: Secretless Windows JVM checks
    needs: plan
    if: needs.plan.outputs.mode == 'checks'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Isolate Gradle user home
        shell: pwsh
        run: '"GRADLE_USER_HOME=$env:RUNNER_TEMP/gradle-checks" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline CI regression tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Offline installer and ZIP contracts
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: ./.github/actions/prepare-native
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
      - name: Assemble and run JVM tests without application credentials
        shell: pwsh
        run: |
          @'
          gradle.beforeProject { project ->
              project.layout.buildDirectory.set(new File(project.projectDir, 'build/ci-checks'))
          }
          '@ | Set-Content "$env:RUNNER_TEMP/ci-checks.init.gradle"
          ./gradlew.bat :desktopApp:assemble :desktopApp:test :shared:jvmTest --project-cache-dir build/ci-checks-gradle-cache --init-script "$env:RUNNER_TEMP/ci-checks.init.gradle" --no-configuration-cache --no-build-cache --console=plain --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw 'JVM checks failed.' }
      - name: Retain exact secretless JVM test failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-jvm-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared/build/ci-checks/test-results/jvmTest/
            shared/build/ci-checks/reports/tests/jvmTest/
            desktopApp/build/ci-checks/test-results/test/
            desktopApp/build/ci-checks/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14
  native:
    name: ${{ needs.plan.outputs.mode == 'release' && 'Test and build official release' || 'Quick commit package' }}
    needs: plan
    if: >-
      github.event_name != 'pull_request' &&
      vars.DISTRIBUTION_REPOSITORY != '' && github.repository == vars.DISTRIBUTION_REPOSITORY &&
      (github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/dev' ||
       (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) &&
      (needs.plan.outputs.mode == 'quick' || needs.plan.outputs.mode == 'release')
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate distribution identity and isolate Gradle user home
        shell: pwsh
        env:
          NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
          NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
        run: |
          $id = 0
          if (-not [int]::TryParse($env:NNGGRAM_API_ID, [ref]$id) -or $id -le 0 -or $env:NNGGRAM_API_HASH -notmatch '^[a-fA-F0-9]{32}$') { throw 'Configure valid NNGGRAM_API_ID and NNGGRAM_API_HASH repository Secrets.' }
          "GRADLE_USER_HOME=$env:RUNNER_TEMP/gradle-native" >> $env:GITHUB_ENV
      - uses: ./.github/actions/prepare-native
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ github.token }}
          set-java-home: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Prepare verified FFmpeg
        shell: pwsh
        run: ./.github/scripts/prepare-media-ci.ps1
      - name: Validate CI scripts and installer contracts
        shell: pwsh
        run: |
          python -B -m unittest discover -s .github/scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'CI script tests failed.' }
          ./scripts/test-windows-installer.ps1
      - name: Build native application with builder-owned Telegram identity
        shell: pwsh
        env:
          NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
          NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
          BUILD_MODE: ${{ needs.plan.outputs.mode }}
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $buildOptions = @{
            GraalVm = $env:GRAALVM_HOME
            BuildName = 'ci-native'
            NativeImageHeap = '4g'
            NativeImageThreads = 2
            RequireTelegramApi = $true
            AppVersion = $env:APP_VERSION
            RunTests = ($env:BUILD_MODE -eq 'release')
          }
          ./scripts/build-desktop-native.ps1 @buildOptions
      - name: Retain official-release JVM test results
        if: always() && needs.plan.outputs.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared/build/ci-native/test-results/jvmTest/
            shared/build/ci-native/reports/tests/jvmTest/
            desktopApp/build/ci-native/test-results/test/
            desktopApp/build/ci-native/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify built EXE using offline native diagnostics
        shell: pwsh
        run: |
          $nativeExe = (Resolve-Path 'desktopApp/build/ci-native/compose/binaries/main/graalvm-app/nngGram/nngGram.exe').Path
          foreach ($mode in @('tdlib', 'platform', 'media')) {
            $report = Join-Path $env:RUNNER_TEMP "ci-$mode-native-result.txt"
            & $nativeExe "--$mode-native-smoke" $report
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw "Offline $mode EXE smoke failed." }
          }
      - name: Package complete native application and installer
        id: package
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ./.github/scripts/prepare-wix-ci.ps1
          ./scripts/package-desktop.ps1 -AppDirectory desktopApp/build/ci-native/compose/binaries/main/graalvm-app/nngGram -Version $env:APP_VERSION -BuildName ci-package -WixDirectory "$env:RUNNER_TEMP/wix311"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          python -B .github/scripts/package_metadata.py build/ci-package
          if ($LASTEXITCODE -ne 0) { throw 'Package metadata failed.' }
          "artifact_name=nngGram-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            build/ci-package/*.zip
            build/ci-package/*.msi
            build/ci-package/SHA256SUMS.txt
            build/ci-package/build-info.json
            build/ci-package/payload-sha256.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  release:
    name: Publish verified tag artifacts
    needs: [plan, native]
    if: >-
      needs.plan.outputs.mode == 'release' && github.ref_type == 'tag' &&
      github.event_name != 'pull_request' &&
      vars.DISTRIBUTION_REPOSITORY != '' && github.repository == vars.DISTRIBUTION_REPOSITORY
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: official-release-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.native.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-dist
      - name: Create draft, verify uploaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release_ci.py "$RUNNER_TEMP/release-dist"
  telegram:
    name: Send CI ZIP to Telegram
    needs: [plan, native]
    # 在仓库 Variables 中显式启用；PR、fork 和其它分支不会向频道发消息。
    if: >-
      vars.TELEGRAM_ENABLED == 'true' && needs.plan.outputs.mode == 'quick' &&
      github.event_name != 'pull_request' &&
      vars.DISTRIBUTION_REPOSITORY != '' && github.repository == vars.DISTRIBUTION_REPOSITORY &&
      (github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # 同一机器人在多个临时服务器之间切换前必须结束上一次发送。
    concurrency:
      group: telegram-ci-channel
      cancel-in-progress: false
      queue: max
    env:
      # 官方 Bot API 10.3 源码；仅缓存编译后的程序，不缓存机器人会话。
      TELEGRAM_BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Telegram configuration
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 -B .github/scripts/telegram_ci.py --check-config

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.native.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-dist

      - name: Restore official Bot API binary
        id: bot-api-cache
        if: steps.telegram-config.outputs.api_mode == 'local'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-ubuntu24.04-${{ runner.arch }}-${{ env.TELEGRAM_BOT_API_COMMIT }}-v1

      - name: Build official Bot API server
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: bash .github/scripts/build_telegram_bot_api.sh

      - name: Cache official Bot API binary
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: ${{ steps.bot-api-cache.outputs.cache-primary-key }}

      - name: Send ZIP or download link through selected Bot API
        timeout-minutes: 25
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_API_BINARY: ${{ runner.temp }}/telegram-bot-api-bin/telegram-bot-api
          ARTIFACT_URL: ${{ needs.native.outputs.artifact_url }}
        run: python3 -B .github/scripts/telegram_ci.py "$RUNNER_TEMP/ci-dist"
