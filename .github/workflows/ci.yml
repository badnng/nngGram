name: CI
# Every branch push builds the installers and keeps them as downloadable artifacts.
on:
  push:
    branches: [main, dev, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    uses: ./.github/workflows/build.yml
    secrets:
      NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
      NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
