name: Build macOS and Linux packages

on:
  workflow_call:
    inputs:
      version:
        description: Version selected by the trusted desktop workflow.
        type: string
        required: true
    secrets:
      NNGGRAM_API_ID:
        required: true
      NNGGRAM_API_HASH:
        required: true

jobs:
  packages:
    name: ${{ matrix.profile }} ${{ matrix.format }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, profile: macos-arm64, format: dmg }
          - { runner: macos-15-intel, profile: macos-x64, format: dmg }
          - { runner: ubuntu-24.04, profile: linux-x64, format: deb }
    env:
      PACKAGE: nngGram-${{ inputs.version }}-${{ matrix.profile }}.${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Restore the pinned platform bundle
        id: tdlib
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/${{ matrix.profile }}
          key: posix-tdlib-${{ matrix.profile }}-${{ matrix.runner }}-${{ hashFiles('native/tdlib-source.properties', 'scripts/build-tdlib.sh') }}${{ matrix.format == 'dmg' && format('-{0}', hashFiles('scripts/bundle-macos-libraries.py', 'scripts/prepare-media-macos.sh')) || '' }}
      - name: Install macOS build dependencies
        if: matrix.format == 'dmg'
        env:
          TDLIB_CACHE_HIT: ${{ steps.tdlib.outputs.cache-hit }}
        run: |
          if [ "$TDLIB_CACHE_HIT" = true ]; then
            brew install cmake ninja
          else
            brew install cmake ninja gperf openssl@3 ffmpeg
          fi
      - name: Install Linux packaging and build dependencies
        if: matrix.format == 'deb'
        env:
          TDLIB_CACHE_HIT: ${{ steps.tdlib.outputs.cache-hit }}
        run: |
          sudo apt-get update
          if [ "$TDLIB_CACHE_HIT" = true ]; then
            sudo apt-get install -y fakeroot cmake ninja-build g++
          else
            sudo apt-get install -y fakeroot cmake ninja-build gperf g++ libssl-dev zlib1g-dev
          fi
      - name: Build TDLib on an exact cache miss
        if: steps.tdlib.outputs.cache-hit != 'true'
        env:
          JOBS: ${{ matrix.format == 'dmg' && '3' || '4' }}
        run: sh scripts/build-tdlib.sh
      - name: Bundle macOS media tools
        if: matrix.format == 'dmg' && steps.tdlib.outputs.cache-hit != 'true'
        run: sh scripts/prepare-media-macos.sh
      - name: Save the platform bundle before application packaging
        if: steps.tdlib.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/${{ matrix.profile }}
          key: ${{ steps.tdlib.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}
      - name: Build the platform installer
        env:
          NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
          NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
          ORG_GRADLE_PROJECT_nnggramVersion: ${{ inputs.version }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          if [ "$PACKAGE_FORMAT" = dmg ]; then
            sh scripts/build-macos.sh --release
          else
            python3 scripts/build-offline-translator.py
            ./gradlew :desktopApp:packageDeb -PrequireTelegramApi=true --no-configuration-cache --console=plain --max-workers=2
          fi
      - name: Verify packaged TDLib and translator offline and checksum the installer
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          report="$RUNNER_TEMP/posix-tdlib-smoke.txt"
          mkdir -p dist
          if [ "$PACKAGE_FORMAT" = dmg ]; then
            set -- desktopApp/build/compose/binaries/main/dmg/*.dmg
            test "$#" -eq 1
            test -f "$1"
            cp "$1" "dist/$PACKAGE"
            app=desktopApp/build/compose/binaries/main/app/nngGram.app
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            "$app/Contents/MacOS/$executable" --tdlib-native-smoke "$report"
            translator="$app/Contents/app/resources/translation/nnggram-translator"
          else
            set -- desktopApp/build/compose/binaries/main/deb/*.deb
            test "$#" -eq 1
            test -f "$1"
            cp "$1" "dist/$PACKAGE"
            extracted=$(mktemp -d "$RUNNER_TEMP/nnggram-deb.XXXXXX")
            dpkg-deb -x "$1" "$extracted"
            launcher="$extracted/opt/nnggram/bin/nngGram"
            test -x "$launcher"
            "$launcher" --tdlib-native-smoke "$report"
            translator="$extracted/opt/nnggram/lib/app/resources/translation/nnggram-translator"
          fi
          test -x "$translator"
          detected=$(cd "$(dirname "$translator")" && printf '%s\n' 'Hello, this is an English sentence.' | ./nnggram-translator --detect)
          test "$detected" = en
          test -s "$report"
          (cd dist && shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256")
      - name: Retain offline TDLib diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posix-tdlib-smoke-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/posix-tdlib-smoke.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain the verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nngGram-posix-${{ matrix.profile }}-${{ github.run_id }}
          path: dist/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
