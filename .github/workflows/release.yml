name: Release
# A vMAJOR.MINOR.PATCH tag builds the installers and publishes them on the tag's GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets:
      NNGGRAM_API_ID: ${{ secrets.NNGGRAM_API_ID }}
      NNGGRAM_API_HASH: ${{ secrets.NNGGRAM_API_HASH }}
